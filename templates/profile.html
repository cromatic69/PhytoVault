<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | PhytoVault</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dialog.css') }}">

    <style>

        body{

            background:var(--cream-50);

            min-height:100vh;

            display:flex;
            align-items:center;
            justify-content:center;

            padding:40px 20px;

        }

        .profile-container{

            max-width:600px;
            width:100%;

            background:white;

            padding:48px 44px;

            border-radius:var(--radius-xl);

            box-shadow:var(--shadow-lg);

        }

        .profile-container h1{

            text-align:center;

            font-size:28px;
            color:var(--forest-900);

            margin-bottom:8px;

        }

        .profile-subtitle{

            text-align:center;

            color:var(--ink-400);
            font-size:14px;

            margin-bottom:36px;

        }

        .form-group{

            margin-bottom:22px;

        }

        label{

            display:block;

            margin-bottom:8px;

            font-weight:600;
            font-size:13.5px;
            color:var(--ink-900);

        }

        input{

            width:100%;

            padding:13px 16px;

            border:1.5px solid var(--cream-200);
            border-radius:var(--radius-sm);

            font-size:14.5px;
            font-family:var(--font-body);

            outline:none;
            transition:.25s;

        }

        input:focus{

            border-color:var(--forest-700);
            box-shadow:0 0 0 4px rgba(45,106,79,.1);

        }

        input[readonly]{

            background:var(--cream-50);
            color:var(--ink-400);

        }

        .btn-group{

            display:flex;
            gap:14px;

            margin-top:32px;

        }

        .btn{

            flex:1;

            padding:14px;

            border:none;
            border-radius:100px;

            background:var(--forest-800);
            color:white;

            font-weight:600;
            font-size:14.5px;

            cursor:pointer;
            text-decoration:none;
            text-align:center;

            transition:.3s;

        }

        .btn:hover{

            background:var(--forest-900);
            transform:translateY(-2px);

        }

        .btn.btn-ghost{

            background:white;
            color:var(--ink-900);
            border:1.5px solid var(--cream-200);

        }

        .btn.btn-ghost:hover{

            border-color:var(--forest-700);
            color:var(--forest-800);
            background:var(--cream-50);

        }

    </style>

</head>

<body>

<div class="profile-container">

    <h1>👤 My Profile</h1>
    <p class="profile-subtitle">Update your account details below.</p>

    {% with messages = get_flashed_messages() %}
    <script type="application/json" id="pv-flash-data">{{ messages | tojson }}</script>
    {% endwith %}

    <form method="POST">

        <div class="form-group">
            <label for="full_name">Full Name</label>
            <input type="text" id="full_name" name="full_name" value="{{ user.full_name }}" required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" value="{{ user.email }}" readonly>
        </div>

        <div class="form-group">
            <label for="institution">Institution</label>
            <input type="text" id="institution" name="institution" value="{{ user.institution }}">
        </div>

        <div class="form-group">
            <label for="country">Country</label>
            <input type="text" id="country" name="country" value="{{ user.country }}">
        </div>

        <div class="btn-group">
            <button class="btn" type="submit">Save Changes</button>
            <a href="/" class="btn btn-ghost">Home</a>
        </div>

    </form>

</div>

<script src="{{ url_for('static', filename='js/dialog.js') }}"></script>

</body>

</html>
